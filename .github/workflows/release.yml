name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Swift toolchain
        run: xcrun swift --version

      - name: Resolve version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: ./scripts/package-release.sh "${{ steps.release.outputs.version }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/NoolNotch-v${VERSION}-arm64.zip" \
            "dist/NoolNotch-v${VERSION}-arm64.zip.sha256" \
            --verify-tag \
            --title "Nool Notch ${GITHUB_REF_NAME}" \
            --generate-notes
